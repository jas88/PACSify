name: Build and test
on: push

jobs:
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: |
          dotnet test -c Debug --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory coverage
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.cobertura.xml
          fail_ci_if_error: false
      - name: Build
        run: |
          mkdir -p dist
          dotnet publish PACSify/PACSify.csproj -c Release -o win -r win-x64 --nologo -v:m --self-contained
          zip -9r dist/PACSify-win.zip win
          dotnet publish PACSify/PACSify.csproj -c Release -o pacsify-lin -r linux-x64 --nologo -v:m --self-contained
          tar cf - pacsify-lin | xz -9e > dist/pacsify-lin.txz
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.11.5
        if: contains(github.ref, 'refs/tags/v')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          
